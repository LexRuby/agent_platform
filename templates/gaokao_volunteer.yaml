name: gaokao_volunteer
display_name: 高考志愿填报分析
description: 检索历年录取数据 → 人工确认考生画像 → 生成志愿方案报告

variables:
  province:
    type: string
    required: true
    description: 省份，如“河南省”
  subject_type:
    type: string
    required: true
    description: 科类，如“物理类”
  score:
    type: integer
    required: true
    description: 高考总分
  rank:
    type: integer
    required: false
    description: 省内位次
  preference:
    type: string
    required: false
    description: 意向专业/地区偏好

steps:
  - id: search_admission
    name: 检索历年录取数据
    type: auto
    instruction: |
      考生信息：{province} {subject_type}，总分 {score}，意向偏好：{preference}。
      调用 search_admission_data 工具，检索该省份科类近三年录取数据。
      整理输出：该分段可报考的院校范围（冲/稳/保三档），每档列出院校名、近三年最低分与位次。
      只使用工具返回的数据，不得编造。
  - id: confirm_profile
    name: 考生画像人工确认
    type: human
    assignee: counselor
    instruction: |
      请核对考生信息并确认画像：
      省份 {province}，科类 {subject_type}，分数 {score}，意向偏好 {preference}。
      请补充或修正考生的兴趣倾向、地域限制、专业禁忌等信息。
  - id: generate_report
    name: 生成志愿方案报告
    type: auto
    instruction: |
      基于“检索历年录取数据”环节的院校范围和人工确认的考生画像，
      先拟定报告大纲（冲稳保策略、院校推荐与理由、风险提示），
      再调用 writing_generate 生成《{province}高考志愿填报建议报告》，
      素材中使用真实检索数据并注明数据年份。
